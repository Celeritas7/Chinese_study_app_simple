<style>
/* ══════════════════════════════════
   THEME CSS VARIABLES
   ══════════════════════════════════ */

:root, [data-theme="dark"] {
  --bg: #0f1218;
  --bg-card: #1a1e28;
  --bg-card-hover: #222838;
  --border: #2a3040;

  --text: #e8e6e1;

  --text-dim: #6b6560;
  --accent: #c4553a;
  --accent-glow: rgba(196,85,58,.08);
  --green: #3dbb8a;
  --green-hover: #2d9a70;
  --purple: #8b5cf6;
  --gold-bg: #f5e6b8;
  --gold-border: #e0c868;
  --gold-text: #3d3020;
  --gold-sub: rgba(61,48,32,.42);
  --white-card: #fff;
  --white-border: #e8e4dc;
  --white-text: #666;
  --white-text-light: #999;
  --white-text-dim: #ccc;
  --white-pill-bg: #f0ede6;
  --tone-exp: linear-gradient(135deg,#0d6b4f,#10b981);
  --tone-panel: #0a3d2e;
  --tone-border: #166a4f;
  --tone-text: #6ee7b7;
  --rad-exp: linear-gradient(135deg,#b45309,#d97706);
  --rad-panel: #3d2000;
  --rad-border: #6d3a00;
  --rad-text: #fcd34d;
  --rad-big: #fbbf24;
  --jp-bg: rgba(88,48,156,.85);
  --jp-bg-hover: rgba(109,40,217,.95);
  --jp-text: #ddd6fe;
  --jp-modal-bg: linear-gradient(145deg,#1e1145,#2d1b69);
  --jp-modal-border: #4c2ea0;
  --cat-cls: linear-gradient(135deg,#c4553a,#d4745d);
  --cat-slf: linear-gradient(135deg,#3dbb8a,#2d9a70);
  --canvas-stroke: #444;
  --canvas-border: #e8e4dc;
}

[data-theme="paper"] {
  --bg: #f4efe6;
  --bg-card: #fff;
  --bg-card-hover: #f9f5ed;
  --border: #e0d8c8;
  --border-hover: #c4b89a;
  --text: #2c2418;
  --text-muted: #6b5d4a;

  --green: #5a8a6a;
  --green-hover: #4a7558;
  --purple: #7b5ea7;
  --gold-bg: #fdf6e3;
  --gold-border: #d4c090;
  --gold-text: #3d3020;
  --gold-sub: rgba(61,48,32,.35);
  --white-card: #fff;
  --white-border: #e0d8c8;
  --white-text: #5a4e3e;
  --white-text-light: #8a7e6e;
  --white-text-dim: #c4b89a;
  --white-pill-bg: #f0ebe0;
  --tone-exp: linear-gradient(135deg,#5a8a6a,#7aaa8a);
  --tone-panel: #eef5f0;
  --tone-border: #c8dece;
  --tone-text: #3a6a4a;
  --rad-exp: linear-gradient(135deg,#9a7040,#b88a50);
  --rad-panel: #f8f0e4;
  --rad-border: #dac8a8;
  --rad-text: #7a5a2a;
  --rad-big: #a07030;
  --jp-bg: rgba(100,70,150,.8);
  --jp-bg-hover: rgba(100,70,150,.95);
  --jp-text: #f0e8ff;
  --jp-modal-bg: linear-gradient(145deg,#f8f0ff,#efe4ff);
  --jp-modal-border: #d0c0e8;
  --cat-cls: linear-gradient(135deg,#8b3a2a,#a0503a);
  --cat-slf: linear-gradient(135deg,#5a8a6a,#4a7558);
  --canvas-stroke: #888;
  --canvas-border: #d4c8b0;
}

[data-theme="night"] {
  --bg: #0a0e1a;
  --bg-card: #121828;
  --bg-card-hover: #1a2238;
  --border: #1e2a44;
  --border-hover: #3a4a6a;
  --text: #e8dcc8;
  --text-muted: #b0a488;
  --text-dim: #6a5e48;
  --accent: #d4a840;
  --accent-glow: rgba(212,168,64,.08);
  --green: #4a9a7a;
  --green-hover: #3a8a6a;
  --purple: #6a6ac8;
  --gold-bg: #1a1810;
  --gold-border: #d4a840;
  --gold-text: #e8dcc8;
  --gold-sub: rgba(232,220,200,.4);
  --white-card: #141a2a;
  --white-border: #1e2a44;
  --white-text: #b0a488;
  --white-text-light: #8a7e68;
  --white-text-dim: #4a4438;
  --white-pill-bg: #1e2438;
  --tone-exp: linear-gradient(135deg,#1a3a2a,#2a5a4a);
  --tone-panel: #0a1a14;
  --tone-border: #1a3a2a;
  --tone-text: #6adaa8;
  --rad-exp: linear-gradient(135deg,#3a2a10,#5a4020);
  --rad-panel: #1a1408;
  --rad-border: #3a2a10;
  --rad-text: #d4a840;
  --rad-big: #e8b830;
  --jp-bg: rgba(60,60,140,.85);
  --jp-bg-hover: rgba(70,70,160,.95);
  --jp-text: #c8c8f0;
  --jp-modal-bg: linear-gradient(145deg,#0a0e2a,#141a3a);
  --jp-modal-border: #2a2a5a;
  --cat-cls: linear-gradient(135deg,#d4a840,#b89030);
  --cat-slf: linear-gradient(135deg,#4a9a7a,#3a8a6a);
  --canvas-stroke: #8a7e68;
  --canvas-border: #1e2a44;
}

[data-theme="jade"] {
  --bg: #080e0a;
  --bg-card: #101c14;
  --bg-card-hover: #18281c;
  --border: #1a3020;
  --border-hover: #2a5030;
  --text: #d4e8d8;
  --text-muted: #8aaa90;
  --text-dim: #4a6a50;
  --accent: #d4a840;
  --accent-glow: rgba(212,168,64,.06);
  --green: #3aba7a;
  --green-hover: #2aa06a;
  --purple: #7a8ad0;
  --gold-bg: #1a2018;
  --gold-border: #3a8a4a;
  --gold-text: #d4e8d8;
  --gold-sub: rgba(212,232,216,.4);
  --white-card: #0e1a10;
  --white-border: #1a3020;
  --white-text: #8aaa90;
  --white-text-light: #5a7a60;
  --white-text-dim: #3a5a40;
  --white-pill-bg: #142418;
  --tone-exp: linear-gradient(135deg,#0a2a1a,#1a4a2a);
  --tone-panel: #081a0e;
  --tone-border: #1a3a20;
  --tone-text: #5adaa0;
  --rad-exp: linear-gradient(135deg,#3a3010,#5a4820);
  --rad-panel: #141208;
  --rad-border: #3a3010;
  --rad-text: #d4a840;
  --rad-big: #e8b830;
  --jp-bg: rgba(40,80,60,.85);
  --jp-bg-hover: rgba(50,100,70,.95);
  --jp-text: #c8e8d0;
  --jp-modal-bg: linear-gradient(145deg,#081408,#0e2010);
  --jp-modal-border: #1a4020;
  --cat-cls: linear-gradient(135deg,#d4a840,#b89030);
  --cat-slf: linear-gradient(135deg,#3aba7a,#2aa06a);
  --canvas-stroke: #5a8a60;
  --canvas-border: #1a3020;
}

[data-theme="sunset"] {
  --bg: #1a100a;
  --bg-card: #241810;
  --bg-card-hover: #2e2018;
  --border: #3a2818;
  --border-hover: #5a4028;
  --text: #f0dcc8;
  --text-muted: #c0a888;
  --text-dim: #7a6448;
  --accent: #c4553a;
  --accent-glow: rgba(196,85,58,.08);
  --green: #8aaa5a;
  --green-hover: #7a9a4a;
  --purple: #a07aaa;
  --gold-bg: #2a1c10;
  --gold-border: #c4553a;
  --gold-text: #f0dcc8;
  --gold-sub: rgba(240,220,200,.4);
  --white-card: #201408;
  --white-border: #3a2818;
  --white-text: #c0a888;
  --white-text-light: #8a7458;
  --white-text-dim: #5a4430;
  --white-pill-bg: #2a2014;
  --tone-exp: linear-gradient(135deg,#2a3a18,#3a5a28);
  --tone-panel: #1a2010;
  --tone-border: #2a3a18;
  --tone-text: #b0da80;
  --rad-exp: linear-gradient(135deg,#5a3010,#7a4820);
  --rad-panel: #2a1808;
  --rad-border: #5a3010;
  --rad-text: #e8a848;
  --rad-big: #f0b830;
  --jp-bg: rgba(120,60,60,.85);
  --jp-bg-hover: rgba(140,70,70,.95);
  --jp-text: #f0d0c8;
  --jp-modal-bg: linear-gradient(145deg,#2a1008,#3a1810);
  --jp-modal-border: #5a2818;
  --cat-cls: linear-gradient(135deg,#c4553a,#d4745d);
  --cat-slf: linear-gradient(135deg,#8aaa5a,#7a9a4a);
  --canvas-stroke: #8a7458;
  --canvas-border: #3a2818;
}

/* ══════════════════════════════════
   BASE STYLES
   ══════════════════════════════════ */
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh;transition:background .4s,color .4s}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{0%{transform:scale(.85);opacity:0}60%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
@keyframes overlayIn{from{opacity:0}to{opacity:1}}
@keyframes modalIn{from{opacity:0;transform:translateY(30px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes rPop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fup{animation:fadeUp .4s ease-out both}

/* NAV */
.tnav{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:2px solid var(--border);background:var(--bg-card);transition:all .4s}
.tni{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px 10px;cursor:pointer;border:none;background:0;color:var(--text-dim);font-size:12px;font-family:'Noto Sans',sans-serif;font-weight:500;transition:all .2s;border-bottom:3px solid transparent}
.tni:hover{color:var(--text-muted);background:var(--bg-card-hover)}
.tni.on{color:var(--accent);border-bottom-color:var(--accent);background:var(--accent-glow)}
.tnic{font-size:18px}

/* SUBHEADER */
.shdr{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border);transition:all .4s}
.bbk{display:flex;align-items:center;gap:6px;background:0;border:0;color:var(--text-muted);font-size:14px;cursor:pointer;font-family:'Noto Sans',sans-serif;transition:color .2s}
.bbk:hover{color:var(--text)}
.sbdg{display:flex;align-items:center;gap:8px}
.ltg{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:6px;background:var(--green);color:#fff;font-size:11px;font-weight:700}
.si{text-align:center}
.snm{font-family:'Crimson Pro',serif;font-size:16px;font-weight:600;color:var(--text)}
.scn{font-size:12px;color:var(--text-dim)}
.sgr{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--bg-card-hover);color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .2s}
.sgr:hover{border-color:var(--border-hover);color:var(--text)}

/* MODE TABS */
.mtbs{display:flex;justify-content:center;gap:8px;padding:14px 20px;border-bottom:1px solid var(--border)}
.mtb{padding:8px 20px;border-radius:20px;border:1.5px solid var(--border);background:0;color:var(--text-dim);font-size:13px;font-family:'Noto Sans',sans-serif;font-weight:500;cursor:pointer;transition:all .25s;white-space:nowrap}
.mtb:hover{border-color:var(--border-hover);color:var(--text-muted)}
.mtb.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

.ss{padding:20px;max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding-bottom:160px}

/* GOLD CARD */
.gc{background:var(--gold-bg);border:2.5px solid var(--gold-border);border-radius:14px;padding:28px 24px;text-align:center;min-height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;transition:all .4s}
.gc-hz{font-family:'Noto Serif SC',serif;font-size:72px;font-weight:700;color:var(--accent);text-shadow:0 2px 8px rgba(196,85,58,.2);line-height:1.1}
.gc-sn{font-family:'Noto Serif SC',serif;font-size:20px;color:var(--gold-text);line-height:2;margin-top:4px}
.gc-sn .tg{font-size:56px;font-weight:700;color:var(--accent);vertical-align:middle;display:inline-block;margin:0 4px;text-shadow:0 2px 8px rgba(196,85,58,.2);line-height:1}
.gc-sm{margin-top:8px;font-family:'Crimson Pro',serif;font-size:14px;font-style:italic;color:var(--gold-sub)}
.gc-pb{font-family:'Crimson Pro',serif;font-size:34px;font-style:italic;color:#4488ff;font-weight:500}
.gc-mb{font-family:'Crimson Pro',serif;font-size:22px;color:var(--green);font-weight:500;margin-top:6px}
.gc-sb{font-family:'Noto Serif SC',serif;font-size:20px;color:var(--gold-text);margin-top:12px;line-height:1.8}
.gc-sb .bk{display:inline-block;border-bottom:3px solid var(--accent);width:40px;margin:0 4px;vertical-align:baseline}
.gc-mo{font-family:'Crimson Pro',serif;font-size:28px;color:var(--green);font-weight:600}

/* JP pill */
.jpb{position:absolute;top:12px;right:12px;display:flex;align-items:center;gap:5px;padding:6px 12px 6px 9px;border-radius:20px;border:none;background:var(--jp-bg);color:var(--jp-text);cursor:pointer;font-family:'Noto Sans',sans-serif;font-size:12px;font-weight:600;transition:all .25s;backdrop-filter:blur(4px);z-index:5;letter-spacing:.02em}
.jpb:hover{background:var(--jp-bg-hover);box-shadow:0 2px 12px rgba(139,92,246,.25);transform:scale(1.04)}

/* HINT CARD */
.hc{background:var(--white-card);border-radius:14px;padding:24px;text-align:center;border:1px solid var(--white-border);min-height:70px;cursor:pointer;transition:all .4s}
.hc:hover{box-shadow:0 2px 10px rgba(0,0,0,.08)}
.hc-ph{font-size:15px;color:var(--white-text-dim);padding:10px 0}
.hc-r{margin-top:12px;animation:rPop .3s ease-out both}
.hc-r:first-child{margin-top:0}
.hc-ht{font-size:15px;color:var(--white-text);font-style:italic;line-height:1.5}
.hc-py{font-family:'Crimson Pro',serif;font-size:30px;font-weight:400;font-style:italic}
.hc-ma{font-size:14px;color:var(--white-text-light);margin-top:2px}
.hc-mn{font-family:'Crimson Pro',serif;font-size:22px;color:#4488ff;font-weight:500}
.hc-mt{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.pl{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:10px;background:var(--white-pill-bg);font-size:11px;color:var(--white-text)}
.pl .rc{font-family:'Noto Serif SC',serif;font-size:14px;color:var(--accent)}
.hc-tm{font-size:12px;color:var(--white-text-dim);font-style:italic;margin-top:10px}
.hc-an{font-family:'Noto Serif SC',serif;font-size:64px;font-weight:700;color:var(--accent);margin-top:6px;animation:rPop .4s ease-out both}
.hc-sb{font-family:'Noto Serif SC',serif;font-size:17px;color:var(--white-text);line-height:1.6}
.hc-sb .bk{display:inline-block;border-bottom:3px solid var(--accent);width:36px;margin:0 3px;vertical-align:baseline}

/* CANVAS */
.crd{background:var(--white-card);border-radius:14px;border:2px solid var(--canvas-border);position:relative;overflow:hidden;transition:all .4s}
.ccl{position:absolute;top:10px;right:12px;padding:4px 12px;border-radius:8px;border:1px solid var(--white-border);background:var(--white-card);color:var(--white-text);font-size:13px;cursor:pointer;font-family:'Noto Sans',sans-serif;display:flex;align-items:center;gap:4px;z-index:5;transition:all .2s}
.ccl:hover{opacity:.8}
.cvs{width:100%;height:200px;cursor:crosshair;touch-action:none;background:transparent}
.cvh{position:absolute;bottom:12px;left:16px;font-size:13px;color:var(--white-text-dim);font-style:italic;pointer-events:none}

/* EXPAND */
.xb{width:100%;padding:14px 20px;border-radius:12px;border:none;font-family:'Noto Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:10px;transition:all .25s;color:#fff}
.xb:active{transform:scale(.98)}
.xb .xa{margin-left:auto;font-size:11px;opacity:.7;transition:transform .3s}
.xb.op .xa{transform:rotate(180deg)}
.xb.op{border-radius:12px 12px 0 0}
.xt{background:var(--tone-exp)}
.xt:hover{box-shadow:0 4px 16px rgba(16,185,129,.2)}
.xrd{background:var(--rad-exp)}
.xrd:hover{box-shadow:0 4px 16px rgba(217,119,6,.2)}
.xp{overflow:hidden;transition:max-height .4s ease,opacity .3s,padding .3s;max-height:0;opacity:0;border-radius:0 0 12px 12px;padding:0 20px}
.xp.op{max-height:400px;opacity:1;padding:20px}
.xp.tp{background:var(--tone-panel);border:1px solid var(--tone-border);border-top:0}
.xp.rdp{background:var(--rad-panel);border:1px solid var(--rad-border);border-top:0}
.prw{display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap}
.ttx{font-size:15px;color:var(--tone-text);line-height:1.6;text-align:center}
.tex{margin-top:10px;font-family:'Noto Serif SC',serif;font-size:22px;color:var(--tone-text);text-align:center;opacity:.8}
.rdb{font-family:'Noto Serif SC',serif;font-size:52px;color:var(--rad-big)}
.rdi{text-align:left;color:var(--rad-text)}
.rdi div{margin-bottom:3px}
.rdl{font-size:14px;color:var(--rad-text)}
.rdd{font-size:12px;opacity:.7;color:var(--rad-text)}

/* RATING */
.rsc{background:var(--bg-card-hover);border-radius:14px;padding:16px 20px;border:1px solid var(--border);transition:all .4s}
.rtt{text-align:center;font-size:13px;color:var(--text-dim);margin-bottom:10px;font-weight:500}
.rrw{display:flex;justify-content:center;gap:10px}
.rrb{width:48px;height:48px;border-radius:12px;border:2px solid var(--border);background:var(--bg-card);font-size:22px;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;position:relative}
.rrb:hover{transform:translateY(-3px);border-color:var(--border-hover);box-shadow:0 6px 16px rgba(0,0,0,.2)}
.rrb.se{animation:popIn .2s ease-out}
.rrb .tip{position:absolute;bottom:-18px;font-size:9px;color:var(--text-dim);white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}
.rrb:hover .tip{opacity:1}

/* BOTTOM */
.bb{position:fixed;bottom:0;left:0;right:0;background:var(--bg-card);border-top:2px solid var(--border);z-index:100;transition:all .4s}
.btr{height:4px;background:var(--bg-card-hover)}
.bfl{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));transition:width .4s ease}
.bbs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;padding:12px 20px 16px;max-width:720px;margin:0 auto}
.nb{padding:13px 24px;border-radius:12px;border:none;font-family:'Noto Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px}
.nb:active{transform:scale(.97)}
.npv{background:var(--bg-card-hover);color:var(--text-muted);border:1px solid var(--border)}
.npv:hover{background:var(--border);color:var(--text)}
.nnx{background:var(--green);color:#fff}
.nnx:hover{background:var(--green-hover)}
.nsh{width:50px;height:50px;border-radius:14px;background:var(--purple);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;transition:all .2s}
.nsh:hover{opacity:.85;transform:scale(1.05)}

/* JP MODAL */
.jov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:center;justify-content:center;animation:overlayIn .2s ease}
.jmd{background:var(--jp-modal-bg);border:1.5px solid var(--jp-modal-border);border-radius:18px;padding:32px 28px;max-width:400px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.4);animation:modalIn .3s ease;position:relative}
.jcx{position:absolute;top:12px;right:14px;width:32px;height:32px;border-radius:8px;border:1px solid var(--jp-modal-border);background:rgba(139,92,246,.1);color:#a78bfa;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}

function guessTone(py) {
  if (!py) return 5;
  const s = py.normalize("NFD");
  if (/\u0304/.test(s)) return 1;
  if (/\u0301/.test(s)) return 2;
  if (/\u030C/.test(s)) return 3;
  if (/\u0300/.test(s)) return 4;
  return 5;
}

// ═══ DATA FETCHING HOOK ═══
function useWords(sourceKey) {
  const [words, setWords] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  useEffect(() => {
    let cancelled = false;
    async function fetchWords() {
      setLoading(true);
      setError(null);
      try {
        // Fetch all rows — no source filter since that column doesn't exist
        const { data, error: err } = await supabase
          .from("chinese_study_app_hanzi_database")
          .select("*")
          .order("id", { ascending: true });
        if (err) throw err;
        if (!cancelled) {
          const cols = data?.[0] ? Object.keys(data[0]) : [];
          console.log("✅ Supabase loaded", data?.length, "rows");
          console.log("📋 Columns:", cols.join(", "));
          if (data?.[0]) console.log("🔍 Sample row:", JSON.stringify(data[0]).slice(0, 800));
          setWords((data || []).map(mapRow));
        }
      } catch (e) {
        console.error("❌ Supabase fetch error:", e);
        if (!cancelled) setError(e.message || "Failed to load words");
      } finally {
        if (!cancelled) setLoading(false);
      }
    }
    fetchWords();
    return () => { cancelled = true; };
  }, [sourceKey]);

  return { words, loading, error };
}
